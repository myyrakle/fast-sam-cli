[package]
name = "sam-build-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust core primitives for AWS SAM CLI build orchestration"

[dependencies]
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

